name: Docker Hub

# Builds the image for amd64 and arm64 and pushes it to Docker Hub.
#   push to main      -> :main and :sha-<short>
#   tag v1.2.3        -> :1.2.3, :1.2, :1 and :latest
# Reads from the GitHub environment "GENERAL": DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# (as secrets, or as variables as a fallback). Optional variable: DOCKERHUB_REPOSITORY
# (default: <username>/squad-assistant).

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: GENERAL
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
      IMAGE: ${{ vars.DOCKERHUB_REPOSITORY || format('{0}/squad-assistant', secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME) }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || vars.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
